<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XinT Codex Account Switcher</title>
  </head>
  <body>
    <div class="shell">
      <header class="hero-panel">
        <div class="hero-copy">
          <h1>XinT Codex Account Switcher</h1>
        </div>
        <div class="hero-side">
          <div id="runtimeBadge" class="runtime-badge"></div>
          <div class="toolbar">
            <button
              id="statusBtn"
              class="icon-button ghost"
              type="button"
              aria-label="打开设置"
              title="设置"
            >
              <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                <path d="M19.4 15a1.9 1.9 0 0 0 .38 2.1l.04.04a2.3 2.3 0 0 1-3.25 3.25l-.04-.04a1.9 1.9 0 0 0-2.1-.38 1.9 1.9 0 0 0-1.15 1.74V22a2.3 2.3 0 0 1-4.6 0v-.06a1.9 1.9 0 0 0-1.15-1.74 1.9 1.9 0 0 0-2.1.38l-.04.04a2.3 2.3 0 0 1-3.25-3.25l.04-.04a1.9 1.9 0 0 0 .38-2.1 1.9 1.9 0 0 0-1.74-1.15H1.7a2.3 2.3 0 0 1 0-4.6h.06A1.9 1.9 0 0 0 3.5 8.33a1.9 1.9 0 0 0-.38-2.1l-.04-.04a2.3 2.3 0 0 1 3.25-3.25l.04.04a1.9 1.9 0 0 0 2.1.38A1.9 1.9 0 0 0 9.62 1.7V1.7a2.3 2.3 0 0 1 4.6 0v.06a1.9 1.9 0 0 0 1.15 1.74 1.9 1.9 0 0 0 2.1-.38l.04-.04a2.3 2.3 0 0 1 3.25 3.25l-.04.04a1.9 1.9 0 0 0-.38 2.1 1.9 1.9 0 0 0 1.74 1.15h.06a2.3 2.3 0 0 1 0 4.6h-.06A1.9 1.9 0 0 0 19.4 15Z"></path>
              </svg>
            </button>
            <button
              id="restartCodexBtn"
              class="icon-button ghost"
              type="button"
              aria-label="重启 Codex"
              title="重启 Codex"
            >
              <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                <path d="M21 3v6h-6"></path>
              </svg>
            </button>
            <button
              id="openProfilesBtn"
              class="icon-button ghost"
              type="button"
              aria-label="打开档案目录"
              title="打开档案目录"
            >
              <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"></path>
              </svg>
            </button>
            <button
              id="themeToggleBtn"
              class="icon-button ghost theme-toggle-button"
              type="button"
              aria-label="切换到深色模式"
              title="切换主题"
            >
              <span class="theme-icon theme-icon-sun" aria-hidden="true">☼</span>
              <span class="theme-icon theme-icon-moon" aria-hidden="true">◐</span>
            </button>
          </div>
        </div>
      </header>

      <main class="content">
        <section class="panel primary-panel">
          <div class="section-head">
            <div>
              <h2>账号档案</h2>
            </div>
            <div class="section-actions">
              <button
                id="refreshUsageBtn"
                class="icon-button ghost"
                type="button"
                aria-label="刷新所有账号额度"
                title="刷新所有账号额度"
              >↻</button>
              <button
                id="addAccountBtn"
                class="icon-button"
                type="button"
                aria-label="添加账号"
                title="添加账号"
              >+</button>
            </div>
          </div>
          <div id="profiles" class="profiles"></div>
        </section>
      </main>
    </div>

    <div id="flash" class="flash hidden" role="status" aria-live="polite">
      <span id="flashText"></span>
      <button
        id="flashCloseBtn"
        class="flash-close"
        type="button"
        aria-label="关闭提示"
        title="关闭提示"
      >×</button>
    </div>

    <template id="profileCardTemplate">
      <article class="profile-card">
        <div class="profile-head">
          <div class="profile-title-row">
            <div class="profile-name"></div>
            <div class="plan-badge"></div>
          </div>
          <div class="status-dot"></div>
        </div>
        <div class="quota-grid">
          <div class="quota-block" data-quota-block="five-hour">
            <div class="quota-label">5 小时额度</div>
            <div class="quota-value" data-quota="five-hour"></div>
            <div class="quota-bar">
              <div class="quota-bar-fill" data-quota-bar="five-hour"></div>
            </div>
            <div class="quota-reset" data-quota-reset="five-hour"></div>
          </div>
          <div class="quota-block" data-quota-block="weekly">
            <div class="quota-label">一周额度</div>
            <div class="quota-value" data-quota="weekly"></div>
            <div class="quota-bar">
              <div class="quota-bar-fill" data-quota-bar="weekly"></div>
            </div>
            <div class="quota-reset" data-quota-reset="weekly"></div>
          </div>
        </div>
        <div class="profile-meta"></div>
        <div class="profile-actions">
          <button data-action="apply" class="profile-switch-button">切换并启动</button>
          <div class="profile-action-group">
            <button
              data-action="download-auth"
              class="ghost icon-action-button"
              type="button"
              aria-label="下载 auth.json"
              title="下载 auth.json"
            >
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15V3"></path>
                <path d="m7 10 5 5 5-5"></path>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              </svg>
            </button>
            <button
              data-action="rename"
              class="ghost icon-action-button"
              type="button"
              aria-label="重命名"
              title="重命名"
            >
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path>
                <path d="M15 5l4 4"></path>
              </svg>
            </button>
            <button
              data-action="delete"
              class="danger icon-action-button"
              type="button"
              aria-label="删除"
              title="删除"
            >
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                <path d="M3 6h18"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
      </article>
    </template>

    <div id="renameModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-action="close-rename"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
        <div class="modal-title" id="renameTitle">重命名档案</div>
        <form id="renameForm" class="modal-form">
          <input id="renameInput" type="text" maxlength="64" placeholder="输入新的档案名" />
          <div class="modal-actions">
            <button type="button" class="ghost" data-action="close-rename">取消</button>
            <button type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="addAccountModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-action="close-add-account"></div>
      <div class="modal-dialog modal-dialog-large" role="dialog" aria-modal="true" aria-labelledby="addAccountTitle">
        <div class="modal-title" id="addAccountTitle">添加账号</div>
        <div class="method-tabs" role="tablist" aria-label="添加账号方式">
          <button type="button" class="method-tab active" data-add-method-tab="oauth">网页 OAuth 授权登录</button>
          <button type="button" class="method-tab" data-add-method-tab="current">保存当前 Codex 档案</button>
          <button type="button" class="method-tab" data-add-method-tab="import-auth">导入 auth.json</button>
        </div>
        <div class="method-panel">
          <div class="method-title" id="addMethodTitle"></div>
          <div class="method-description" id="addMethodDescription"></div>
          <div class="method-note" id="addMethodNote"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="ghost" data-action="close-add-account">取消</button>
          <button type="button" id="addMethodActionBtn">开始</button>
        </div>
      </div>
    </div>

    <div id="currentStateModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-action="close-current-state"></div>
      <div class="modal-dialog modal-dialog-settings" role="dialog" aria-modal="true" aria-labelledby="currentStateTitle">
        <div class="settings-shell">
          <aside class="settings-sidebar" aria-label="设置分类">
            <div class="modal-title settings-title" id="currentStateTitle">设置</div>
            <button type="button" class="settings-nav active" data-settings-section="config">配置</button>
            <button type="button" class="settings-nav" data-settings-section="status">状态</button>
            <button type="button" class="settings-nav" data-settings-section="about">关于</button>
          </aside>
          <section class="settings-content" id="settingsContent"></section>
        </div>
        <div class="modal-actions settings-actions">
          <button type="button" class="ghost" data-action="close-current-state">关闭</button>
        </div>
      </div>
    </div>

    <div id="oauthPendingModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="oauthPendingTitle">
        <div class="modal-title" id="oauthPendingTitle">等待网页登录授权</div>
        <div class="method-description">
          浏览器已打开官方授权页面。完成登录后会自动回到切换器；如果不继续，可以直接取消本次授权。
        </div>
        <div class="modal-actions">
          <button
            type="button"
            id="cancelOAuthBtn"
            class="danger"
            data-allow-busy="true"
          >取消授权</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/renderer.js"></script>
  </body>
</html>
